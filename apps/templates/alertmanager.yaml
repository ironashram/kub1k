apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager
  namespace: argocd
  labels:
    app/cluster: "{{ .Values.environment }}"
    app/source: upstream
spec:
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
  source:
    chart: alertmanager
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 2.1.3
    helm:
      valuesObject:
        replicaCount: 2
        podAntiAffinity: hard
        baseURL: https://alertmanager.{{ .Values.internalDomain }}
        persistence:
          enabled: true
          storageClass: local-path
          size: 2Gi
        ingress:
          enabled: true
          className: haproxy
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            haproxy-ingress.github.io/balance-algorithm: source
          hosts:
            - host: alertmanager.{{ .Values.internalDomain }}
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - secretName: alertmanager-cert
              hosts:
                - alertmanager.{{ .Values.internalDomain }}
        config:
          global:
            resolve_timeout: 5m
          route:
            group_by: ['namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: matrix
            routes:
              - matchers:
                  - alertname="TargetDown"
                  - job="workstations-node"
                receiver: 'null'
          inhibit_rules:
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity=~"warning|info"
              equal:
                - namespace
                - alertname
            - source_matchers:
                - severity="warning"
              target_matchers:
                - severity="info"
              equal:
                - namespace
                - alertname
            - source_matchers:
                - alertname="InfoInhibitor"
              target_matchers:
                - severity="info"
              equal:
                - namespace
            - target_matchers:
                - alertname="InfoInhibitor"
          receivers:
            - name: matrix
              webhook_configs:
                - url: "https://matrix-alertmanager-receiver.{{ .Values.externalDomain }}/alerts/k8s-alerts"
                  send_resolved: true
            - name: 'null'
  destination:
    name: in-cluster
    namespace: monitoring
