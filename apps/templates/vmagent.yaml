{{- range $shard := list "a" "b" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmagent-{{ $shard }}
  namespace: argocd
  labels:
    app/cluster: "{{ $.Values.environment }}"
    app/source: upstream
spec:
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
  source:
    chart: victoria-metrics-agent
    repoURL: https://victoriametrics.github.io/helm-charts/
    targetRevision: 0.51.0
    helm:
      valuesObject:
        replicaCount: 1
        service:
          enabled: true
        podLabels:
          kub1k.io/workload-heavy: "true"
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: victoria-metrics-agent
                topologyKey: kubernetes.io/hostname
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            nodeTaintsPolicy: Honor
            nodeAffinityPolicy: Honor
            labelSelector:
              matchLabels:
                kub1k.io/workload-heavy: "true"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        extraArgs:
          envflag.enable: true
          envflag.prefix: VM_
          loggerFormat: json
          remoteWrite.label: "cluster={{ $.Values.environment }}"
        remoteWrite:
          - url: https://vm-{{ $shard }}.{{ $.Values.internalDomain }}/api/v1/write
        config:
          global:
            scrape_interval: 60s
          scrape_configs:
            - job_name: apiserver
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                server_name: kubernetes
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    names: [default]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                  regex: kubernetes;https
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  target_label: endpoint
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: (apiserver|workqueue|rest_client|process|go)_(.+)
                  action: keep
            {{- range $path := list "/metrics" "/metrics/cadvisor" "/metrics/probes" }}
            - job_name: kubelet{{ $path | replace "/metrics" "" | replace "/" "-" }}
              scheme: https
              metrics_path: {{ $path }}
              honor_labels: true
              honor_timestamps: false
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - target_label: job
                  replacement: kubelet
                - source_labels: [__address__]
                  target_label: instance
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - source_labels: [__metrics_path__]
                  target_label: metrics_path
                - target_label: namespace
                  replacement: kube-system
                - target_label: service
                  replacement: kubelet
                - target_label: endpoint
                  replacement: https-metrics
              {{- if eq $path "/metrics" }}
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: (kubelet|storage|rest_client|process|go)_(.+)
                  action: keep
              {{- else if eq $path "/metrics/cadvisor" }}
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
                  action: drop
                - source_labels: [__name__]
                  regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
                  action: drop
                - source_labels: [__name__]
                  regex: container_memory_mapped_file
                  action: drop
                - source_labels: [__name__]
                  regex: container_(file_descriptors|tasks_state|threads_max)
                  action: drop
                - source_labels: [__name__, scope]
                  regex: container_memory_failures_total;hierarchy
                  action: drop
                - source_labels: [__name__, interface]
                  regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
                  action: drop
                - source_labels: [__name__]
                  regex: container_spec.*
                  action: drop
                - source_labels: [id, pod]
                  regex: .+;
                  action: drop
              {{- end }}
            {{- end }}
            - job_name: kube-etcd
              scheme: http
              static_configs:
                - targets:
                  {{- range $.Values.k8sControlNodes }}
                  - '{{ . }}:2381'
                  {{- end }}
              relabel_configs:
                - target_label: namespace
                  replacement: kube-system
                - target_label: service
                  replacement: kube-etcd
                - target_label: endpoint
                  replacement: http-metrics
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: (etcd|grpc|rest_client|process|go)_(.+)
                  action: keep
            - job_name: kube-controller-manager
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets:
                  {{- range $.Values.k8sControlNodes }}
                  - '{{ . }}:10257'
                  {{- end }}
              relabel_configs:
                - target_label: namespace
                  replacement: kube-system
                - target_label: service
                  replacement: kube-controller-manager
                - target_label: endpoint
                  replacement: https-metrics
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: (workqueue|rest_client|process|go)_(.+)
                  action: keep
            - job_name: kube-scheduler
              scheme: https
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets:
                  {{- range $.Values.k8sControlNodes }}
                  - '{{ . }}:10259'
                  {{- end }}
              relabel_configs:
                - target_label: namespace
                  replacement: kube-system
                - target_label: service
                  replacement: kube-scheduler
                - target_label: endpoint
                  replacement: https-metrics
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: (scheduler|rest_client|process|go)_(.+)
                  action: keep
            - job_name: node-exporter
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    names: [monitoring]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name, __meta_kubernetes_endpointslice_port_name]
                  regex: prometheus-node-exporter;http-metrics
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  target_label: endpoint
            - job_name: kube-state-metrics
              honor_labels: true
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    names: [monitoring]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name, __meta_kubernetes_endpointslice_port_name]
                  regex: kube-state-metrics;http
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  target_label: endpoint
            - job_name: services
              kubernetes_sd_configs:
                - role: endpointslice
              relabel_configs:
                - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                  regex: calico-system;(felix|typha)-metrics-svc;metrics-port|monitoring;(victoria-metrics-[ab]|vmalert-[ab]-victoria-metrics-alert-server|vmagent-[ab]-victoria-metrics-agent|alertmanager);http|monitoring;grafana;http-web
                  action: keep
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: job
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  target_label: endpoint
            - job_name: honor-labels-services
              honor_labels: true
              kubernetes_sd_configs:
                - role: endpointslice
              relabel_configs:
                - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                  regex: monitoring;prometheus-pushgateway;http
                  action: keep
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: job
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  target_label: endpoint
            - job_name: n42-gateway
              scrape_interval: 10s
              honor_labels: true
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    names: [n42-gateway]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                  regex: n42-gateway-metrics;(metrics|ctrl-metrics)
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  target_label: endpoint
            - job_name: veeam-exporter
              kubernetes_sd_configs:
                - role: endpointslice
                  namespaces:
                    names: [monitoring]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
                  regex: veeam-exporter;metrics
                  action: keep
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  target_label: endpoint
              metric_relabel_configs:
                - regex: instance|pod
                  action: labeldrop
            - job_name: metallb
              scheme: https
              honor_labels: true
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [metallb-system]
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: metricshttps|frrmetricshttps
                  action: keep
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
                  target_label: job
                  replacement: metallb-$1
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  target_label: endpoint
            - job_name: pods
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_container_port_name, __meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: cert-manager;(http-metrics|metrics);.*|cnpg-system;metrics;.*|external-secrets;metrics;.*|keycloak;(metrics|http-internal);.*|argocd;metrics;argocd-applicationset-controller
                  action: keep
                - source_labels: [__meta_kubernetes_pod_label_app]
                  regex: (.+)
                  target_label: job
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: (.+)
                  target_label: job
                - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app_kubernetes_io_name]
                  regex: cert-manager;(cainjector|webhook)
                  target_label: job
                  replacement: cert-manager-$1
                - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                  regex: (.+)
                  target_label: job
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_container_name]
                  target_label: container
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  target_label: endpoint
            - job_name: kub1k-annotated-endpoints
              kubernetes_sd_configs:
                - role: endpointslice
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_annotation_kub1k_io_scrape]
                  regex: "true"
                  action: keep
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  regex: (.+)
                  action: keep
                - source_labels: [__address__, __meta_kubernetes_service_annotation_kub1k_io_port]
                  regex: '(.+?)(?::\d+)?;(\d+)'
                  target_label: __address__
                  replacement: $1:$2
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: job
                - source_labels: [__meta_kubernetes_service_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_endpointslice_port_name]
                  target_label: endpoint
            - job_name: workstations-node
              static_configs:
                {{- range $host := list "ashram" "amarok" "nargaroth" }}
                - targets:
                    - '{{ $host }}.{{ $.Values.externalDomain }}:9100'
                  labels:
                    instance: {{ $host }}
                {{- end }}
            - job_name: commstack-node
              static_configs:
                - targets:
                    - 'matrix.{{ $.Values.externalDomain }}:9100'
                  labels:
                    instance: commstack
            - job_name: commstack-cadvisor
              honor_timestamps: false
              static_configs:
                - targets:
                    - 'matrix.{{ $.Values.externalDomain }}:8080'
                  labels:
                    instance: commstack
            - job_name: commstack-haproxy
              static_configs:
                - targets:
                    - 'matrix.{{ $.Values.externalDomain }}:8405'
                  labels:
                    instance: commstack
            - job_name: commstack-synapse
              metrics_path: /_synapse/metrics
              static_configs:
                - targets:
                    - 'matrix.{{ $.Values.externalDomain }}:9000'
                  labels:
                    instance: commstack
  destination:
    name: in-cluster
    namespace: monitoring
{{- end }}
