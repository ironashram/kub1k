{{- range $shard := list "a" "b" }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmalert-{{ $shard }}
  namespace: argocd
  labels:
    app/cluster: "{{ $.Values.environment }}"
    app/source: upstream
spec:
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
  source:
    chart: victoria-metrics-alert
    repoURL: https://victoriametrics.github.io/helm-charts/
    targetRevision: 0.52.0
    helm:
      valuesObject:
        server:
          replicaCount: 1
          configMap: alerting-rules
          extraArgs:
            envflag.enable: true
            envflag.prefix: VM_
            loggerFormat: json
            httpListenAddr: :8880
            external.label: "cluster={{ $.Values.environment }}"
            external.url: https://vm-{{ $shard }}.{{ $.Values.internalDomain }}
            external.alert.source: 'vmui/#/?g0.expr={{ "{{.Expr|queryEscape}}" }}&g0.range_input=30m'
            configCheckInterval: 30m
            rule:
              - /config/*.yaml
            remoteWrite.url: https://vm-{{ $shard }}.{{ $.Values.internalDomain }}
          datasource:
            url: https://vm-{{ $shard }}.{{ $.Values.internalDomain }}
          notifiers:
            - url: http://alertmanager-0.alertmanager-headless.monitoring.svc:9093
            - url: http://alertmanager-1.alertmanager-headless.monitoring.svc:9093
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: victoria-metrics-alert
                  topologyKey: kubernetes.io/hostname
        alertmanager:
          enabled: false
  destination:
    name: in-cluster
    namespace: monitoring
{{- end }}
