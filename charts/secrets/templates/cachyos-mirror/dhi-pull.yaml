apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cachyos-mirror-dhi-pull
  namespace: cachyos-mirror
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cachyos-mirror-dhi-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{ `{"auths":{"dhi.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` }}'
  data:
    - secretKey: username
      remoteRef:
        key: "/dockerhub"
        property: username
    - secretKey: token
      remoteRef:
        key: "/dockerhub"
        property: token
