apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9101
          env:
            - name: VEEAM_URL
              value: {{ .Values.veeam.url | quote }}
            - name: VEEAM_TLS_INSECURE
              value: {{ .Values.veeam.tlsInsecure | quote }}
            - name: VEEAM_SESSION_TYPES
              value: {{ .Values.veeam.sessionTypes | quote }}
            - name: VEEAM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: username
            - name: VEEAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
